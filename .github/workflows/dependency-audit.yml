name: Dependency Audit

# Scheduled release-policy audit. It is intentionally separate from PR CI so
# unavoidable transitive advisories never gate ordinary pull requests. The job
# fails when a high/critical advisory is new or its documented exception has
# expired. Current exceptions live in pwa/SECURITY_EXCEPTIONS.md and
# pwa/functions/SECURITY_EXCEPTIONS.md; all findings remain visible warnings.
on:
  schedule:
    # Mondays at 08:00 UTC.
    - cron: '0 8 * * 1'
  workflow_dispatch:

concurrency:
  group: dependency-audit
  cancel-in-progress: false

# Least-privilege GITHUB_TOKEN (WS-K): the audit only reads the repo + committed lockfiles.
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            pwa/package-lock.json
            pwa/functions/package-lock.json
      # Audits run against the committed lockfiles, so no install is needed. The
      # shared policy script writes a compact table to the job summary, emits
      # annotations when findings need attention, and fails on new/expired high
      # findings.
      - name: Audit pwa
        working-directory: pwa
        run: npm run audit:dependencies
      - name: Audit pwa/functions
        working-directory: pwa/functions
        run: npm run audit:dependencies
